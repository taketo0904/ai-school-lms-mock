<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="オンラインスクール向けLMSのUIモック">
<meta name="robots" content="noindex">
<title>道場 — AIスクール LMS(モック)</title>
</head>
<body>
<style>
  :root{
    --paper:#f4f6f9; --card:#fff; --card2:#eef2f8; --head:#f7f9fc;
    --ink:#16233d; --ink2:#3c4a64; --dim:#6c7a92;
    --line:#dbe2ec; --line2:#c2cddc;
    --blue:#1857a8; --blue-d:#12447f; --blue-s:#e8f0fb; --blue-ink:#fff;
    --mag:#cf0e70; --mag-s:#fce7f2;
    --ok:#0f7f5e; --ok-s:#e3f3ee;
    --warn:#c2410c; --warn-s:#fdeee4;
    --star:#e0a109; --orange:#e07a2f;
    --sh1:0 1px 2px rgba(22,35,61,.07);
    --sh2:0 1px 3px rgba(22,35,61,.09),0 8px 20px -12px rgba(22,35,61,.2);
    --r:8px; --r2:5px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#0b1120; --card:#141d2e; --card2:#1b2540; --head:#1a2440;
      --ink:#eef3fa; --ink2:#c2ccdd; --dim:#8a97ad;
      --line:#26324a; --line2:#3a4a66;
      --blue:#5d9dee; --blue-d:#7db4f5; --blue-s:#16294a; --blue-ink:#08111f;
      --mag:#ff62ab; --mag-s:#3b0f28;
      --ok:#3ec191; --ok-s:#0f3229;
      --warn:#f59e6b; --warn-s:#3a1e10;
      --star:#f0bb3d; --orange:#f0975a;
      --sh1:0 1px 2px rgba(0,0,0,.45);
      --sh2:0 1px 3px rgba(0,0,0,.55),0 10px 24px -14px rgba(0,0,0,.85);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0b1120; --card:#141d2e; --card2:#1b2540; --head:#1a2440;
    --ink:#eef3fa; --ink2:#c2ccdd; --dim:#8a97ad; --line:#26324a; --line2:#3a4a66;
    --blue:#5d9dee; --blue-d:#7db4f5; --blue-s:#16294a; --blue-ink:#08111f;
    --mag:#ff62ab; --mag-s:#3b0f28; --ok:#3ec191; --ok-s:#0f3229;
    --warn:#f59e6b; --warn-s:#3a1e10; --star:#f0bb3d; --orange:#f0975a;
    --sh1:0 1px 2px rgba(0,0,0,.45); --sh2:0 1px 3px rgba(0,0,0,.55),0 10px 24px -14px rgba(0,0,0,.85);
  }
  :root[data-theme="light"]{
    --paper:#f4f6f9; --card:#fff; --card2:#eef2f8; --head:#f7f9fc;
    --ink:#16233d; --ink2:#3c4a64; --dim:#6c7a92; --line:#dbe2ec; --line2:#c2cddc;
    --blue:#1857a8; --blue-d:#12447f; --blue-s:#e8f0fb; --blue-ink:#fff;
    --mag:#cf0e70; --mag-s:#fce7f2; --ok:#0f7f5e; --ok-s:#e3f3ee;
    --warn:#c2410c; --warn-s:#fdeee4; --star:#e0a109; --orange:#e07a2f;
    --sh1:0 1px 2px rgba(22,35,61,.07); --sh2:0 1px 3px rgba(22,35,61,.09),0 8px 20px -12px rgba(22,35,61,.2);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
    font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .mincho{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
  .tnum{font-variant-numeric:tabular-nums}
  h1,h2,h3,h4{margin:0;font-size:inherit;font-weight:inherit;text-wrap:balance}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:var(--blue)}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ===== topbar ===== */
  .topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;
    height:56px;padding:0 18px;background:var(--card);border-bottom:1px solid var(--line)}
  .burger{background:none;border:none;cursor:pointer;color:var(--ink2);font-size:17px;padding:4px 6px;display:none}
  @media (max-width:900px){.burger{display:block}}
  .logo{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
  .logo .mark{font-size:20px;font-weight:600;letter-spacing:.08em;
    background:linear-gradient(95deg,var(--mag),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo .tag{font-size:11px;color:var(--dim);white-space:nowrap}
  @media (max-width:760px){.logo .tag{display:none}}
  .ticon{background:none;border:none;cursor:pointer;color:var(--dim);font-size:15px;padding:5px 6px;position:relative}
  .ticon:hover{color:var(--ink)}
  .ticon .dot{position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--mag)}
  .me{width:29px;height:29px;border-radius:50%;background:var(--blue-s);color:var(--blue);
    border:1px solid var(--line);display:grid;place-items:center;font-size:11.5px;font-weight:700;flex-shrink:0}

  /* ===== shell ===== */
  .shell{display:grid;grid-template-columns:236px minmax(0,1fr)}
  @media (max-width:900px){ .shell{grid-template-columns:1fr} }
  .scrim{display:none}

  /* ===== sidebar ===== */
  .side{background:var(--card);border-right:1px solid var(--line);align-self:start;
    position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
  /* 狭幅ではドロワー。基本ルールの position:sticky を上書きするため、
     必ずこのブロックより後ろに置くこと（同一詳細度は後勝ち） */
  @media (max-width:900px){
    .side{position:fixed;inset:56px auto 0 0;width:min(280px,84vw);max-height:none;z-index:35;
      transform:translateX(-100%);transition:transform .18s ease;overflow-y:auto;box-shadow:var(--sh2)}
    .side[data-open="true"]{transform:none}
    .scrim{position:fixed;inset:56px 0 0 0;background:rgba(10,17,32,.45);z-index:34}
    .scrim[data-open="true"]{display:block}
  }
  .modeseg{display:flex;padding:10px 12px 8px;gap:0}
  .modeseg button{flex:1;background:var(--card);border:1px solid var(--line2);color:var(--dim);
    font-size:12.5px;padding:6px 4px;cursor:pointer}
  .modeseg button:first-child{border-radius:var(--r2) 0 0 var(--r2)}
  .modeseg button:last-child{border-radius:0 var(--r2) var(--r2) 0;border-left:none}
  .modeseg button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--blue-ink);font-weight:600}
  .navgroup{border-top:1px solid var(--line)}
  .ghead{width:100%;display:flex;align-items:center;gap:9px;background:none;border:none;cursor:pointer;
    padding:11px 14px;text-align:left;color:var(--blue);font-size:13px;font-weight:600}
  .ghead .ic{font-size:13px;width:16px;flex-shrink:0}
  .ghead .cv{margin-left:auto;color:var(--dim);font-size:10px;transition:transform .16s}
  .navgroup[data-open="true"] .ghead .cv{transform:rotate(180deg)}
  .glist{display:none;padding-bottom:4px}
  .navgroup[data-open="true"] .glist{display:block}
  .nav{width:100%;display:flex;align-items:center;gap:8px;background:none;border:none;cursor:pointer;
    padding:8px 14px 8px 30px;text-align:left;color:var(--ink2);font-size:12.5px;border-left:3px solid transparent}
  .nav:hover{background:var(--card2);color:var(--ink)}
  .nav[aria-current="true"]{background:var(--blue-s);color:var(--blue);font-weight:600;border-left-color:var(--blue)}
  .subhead{padding:7px 14px 3px 30px;font-size:11px;color:var(--dim);font-weight:700;letter-spacing:.04em}
  .nav.sub{padding-left:42px}
  .nav.sub::before{content:"└";position:absolute;margin-left:-14px;color:var(--line2);font-size:10px}
  .nav{position:relative}
  .nav .cnt{margin-left:auto;font-size:10.5px;color:var(--dim)}
  .nav[aria-current="true"] .cnt{color:var(--blue)}
  .navtop{padding-left:14px}
  .sidesearch{padding:10px 14px 14px;border-top:1px solid var(--line)}
  .sidesearch .lb{font-size:11px;color:var(--dim);margin-bottom:6px}
  .radiorow{display:flex;gap:12px;margin-bottom:8px}
  .radiorow label{display:flex;align-items:center;gap:5px;font-size:12px;cursor:pointer}
  .radiorow input{accent-color:var(--blue)}
  .sfield{display:flex;gap:0}
  .sfield input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line2);
    border-radius:var(--r2) 0 0 var(--r2);padding:7px 9px;font-size:12.5px}
  .sfield button{background:var(--card);border:1px solid var(--line2);border-left:none;
    border-radius:0 var(--r2) var(--r2) 0;padding:0 10px;cursor:pointer;color:var(--blue)}
  .badgeNew{background:var(--mag);color:#fff;font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:3px;margin-left:6px}

  /* ===== content ===== */
  main{padding:18px 22px 44px;min-width:0}
  @media (max-width:560px){main{padding:14px 14px 36px}}
  .crumb{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--dim);margin-bottom:14px;flex-wrap:wrap}
  .crumb button{background:none;border:none;padding:0;cursor:pointer;color:var(--blue);text-decoration:none}
  .crumb button:hover{text-decoration:underline}
  .crumb .here{color:var(--ink)}
  .ptitle{font-size:19px;margin-bottom:14px}
  .sectitle{color:var(--blue);font-size:13.5px;font-weight:700;margin-bottom:12px}

  /* buttons */
  .b{border:1px solid var(--line2);background:var(--card);color:var(--ink);padding:7px 14px;
    border-radius:var(--r2);font-size:12.5px;cursor:pointer;white-space:nowrap}
  .b:hover{background:var(--card2)}
  .b:disabled{opacity:.4;cursor:not-allowed}
  .b-pri{background:var(--blue);border-color:var(--blue);color:var(--blue-ink);font-weight:600}
  .b-pri:hover{background:var(--blue-d)}
  .b-org{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:600}
  .b-org:hover{filter:brightness(1.06)}
  .b-lg{padding:10px 20px;font-size:13.5px}
  .b-sm{padding:5px 10px;font-size:11.5px}
  .link{background:none;border:none;padding:0;color:var(--blue);font-size:12px;text-decoration:underline;cursor:pointer}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh1)}
  .pad{padding:16px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .grow{flex:1}
  .bar{flex:1;height:6px;border-radius:999px;background:var(--card2);overflow:hidden;border:1px solid var(--line)}
  .bar>i{display:block;height:100%;background:var(--blue)}
  .bar.ok>i{background:var(--ok)}
  .chip{font-size:10.5px;padding:3px 8px;border-radius:999px;white-space:nowrap;font-weight:600;
    background:var(--card2);color:var(--dim);border:1px solid var(--line)}
  .chip.b{background:var(--blue-s);color:var(--blue);border-color:var(--blue)}
  .chip.g{background:var(--ok-s);color:var(--ok);border-color:var(--ok)}
  .chip.m{background:var(--mag-s);color:var(--mag);border-color:var(--mag)}
  .chip.w{background:var(--warn-s);color:var(--warn);border-color:var(--warn)}

  /* ===== learner: resume ===== */
  .resume{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;background:var(--card);
    border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:var(--r);
    padding:16px 18px;box-shadow:var(--sh2);margin-bottom:18px}
  @media (max-width:660px){.resume{grid-template-columns:1fr}}
  .resume .eb{font-size:10.5px;letter-spacing:.13em;color:var(--blue);font-weight:700}
  .resume h2{font-size:18px;margin:4px 0 3px}
  .resume .wh{font-size:12.5px;color:var(--dim)}
  .resume .bw{display:flex;align-items:center;gap:10px;margin-top:11px;max-width:400px}

  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:18px}
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
  .ch{font-size:11px;letter-spacing:.09em;color:var(--dim);font-weight:700;margin-bottom:10px}

  /* ===== homework ===== */
  .hw{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
  .hw:first-of-type{border-top:none}
  .hw input{margin:3px 0 0;accent-color:var(--ok);flex-shrink:0}
  .hw .tx{flex:1;min-width:0;font-size:13px}
  .hw[data-done="true"] .tx{color:var(--dim);text-decoration:line-through}
  .hw .due{font-size:11px;color:var(--dim);white-space:nowrap;margin-top:2px}
  .hw[data-over="true"] .due{color:var(--warn);font-weight:700}
  .hw .src{font-size:10.5px;color:var(--dim);margin-top:2px}

  /* ===== course library cards ===== */
  .libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
  .lib{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
    box-shadow:var(--sh1);display:flex;flex-direction:column;text-align:left;cursor:pointer;padding:0}
  .lib:hover{box-shadow:var(--sh2)}
  .thumb{position:relative;aspect-ratio:16/9;display:grid;place-items:center;padding:10px;
    background:linear-gradient(125deg,#cf0e70,#7b2ab8 45%,#1857a8);color:#fff}
  .thumb .bn{font-size:9px;letter-spacing:.16em;opacity:.85;position:absolute;top:8px;left:10px}
  .thumb .tt{font-size:13px;font-weight:700;text-align:center;line-height:1.35;text-shadow:0 1px 4px rgba(0,0,0,.35)}
  .thumb .dur{position:absolute;bottom:6px;right:8px;font-size:10.5px;background:rgba(0,0,0,.6);padding:1px 6px;border-radius:3px}
  .thumb.lock{filter:saturate(.25) brightness(.7)}
  .thumb .lk{position:absolute;inset:0;display:grid;place-items:center;font-size:20px}
  .lib .bd{padding:11px 12px;display:flex;flex-direction:column;gap:7px;flex:1}
  .lib .nm{font-size:13.5px;font-weight:600}
  .lib .mt{font-size:11px;color:var(--dim)}
  .lib .ft{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-top:1px solid var(--line)}
  .iconb{background:none;border:none;cursor:pointer;color:var(--line2);font-size:15px;padding:2px 4px;line-height:1}
  .iconb:hover{color:var(--mag)}
  .iconb[aria-pressed="true"]{color:var(--mag)}
  .iconb.sh:hover{color:var(--blue)}

  /* ===== course detail ===== */
  .chead{display:grid;grid-template-columns:210px minmax(0,1fr) auto;gap:18px;align-items:start}
  @media (max-width:820px){.chead{grid-template-columns:1fr}}
  .chead .th{border-radius:var(--r2);overflow:hidden}
  .chead h2{font-size:20px;margin-bottom:8px}
  .chead .ab{font-size:13px;color:var(--ink2);margin:0}
  .sns{display:flex;gap:7px;justify-content:flex-end;margin-bottom:10px}
  .sns button{width:28px;height:28px;border-radius:50%;border:none;cursor:pointer;color:#fff;font-size:11px;display:grid;place-items:center}
  .sns .tw{background:#1d9bf0}.sns .fb{background:#1877f2}.sns .ln{background:#06c755}
  .lesgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .les{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;
    box-shadow:var(--sh1);display:flex;flex-direction:column;padding:0;cursor:pointer;text-align:left}
  .les:hover{box-shadow:var(--sh2);border-color:var(--line2)}
  .les .top{position:relative;background:var(--head);border-bottom:1px solid var(--line);padding:8px 10px 26px;min-height:96px}
  .les .sc{display:inline-block;font-size:10px;color:var(--ink2);border-bottom:2px solid var(--mag);padding-bottom:1px}
  .les .ti{font-size:12.5px;margin-top:9px;text-align:center;line-height:1.4}
  .les .dr{position:absolute;bottom:6px;right:8px;font-size:10.5px;background:rgba(0,0,0,.62);color:#fff;padding:1px 6px;border-radius:3px}
  .les .st{position:absolute;bottom:6px;left:8px;font-size:10px;font-weight:700}
  .les[data-state="done"] .st{color:var(--ok)}
  .les[data-state="current"] .st{color:var(--blue)}
  .les .bt{display:flex;align-items:center;justify-content:space-between;padding:7px 10px}

  /* ===== lesson player ===== */
  .lgrid{display:grid;grid-template-columns:minmax(0,1fr) 262px;gap:22px;align-items:start}
  @media (max-width:940px){.lgrid{grid-template-columns:1fr}}
  .video{aspect-ratio:16/9;background:var(--card2);border:1px solid var(--line);border-radius:var(--r);
    display:grid;place-items:center;position:relative;margin-bottom:14px}
  .video .pl{width:52px;height:52px;border-radius:50%;background:var(--blue);color:var(--blue-ink);display:grid;place-items:center;font-size:16px}
  .video .tm{position:absolute;bottom:10px;right:12px;font-size:11.5px;background:rgba(0,0,0,.6);color:#fff;padding:2px 7px;border-radius:4px}
  .obox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px;box-shadow:var(--sh1)}
  .obox>h4{font-size:11px;letter-spacing:.09em;color:var(--dim);font-weight:700;padding:11px 13px;border-bottom:1px solid var(--line)}
  .orow{width:100%;display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;
    background:none;border:none;border-top:1px solid var(--line);padding:8px 13px;cursor:pointer;text-align:left}
  .orow:first-child{border-top:none}
  .orow:hover{background:var(--blue-s)}
  .orow[aria-current="true"]{background:var(--blue-s)}
  .orow .dt{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;font-size:9px;
    border:1px solid var(--line2);background:var(--card);color:var(--dim)}
  .orow[data-state="done"] .dt{background:var(--ok);border-color:var(--ok);color:#fff}
  .orow[data-state="current"] .dt{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
  .orow .nm{font-size:12.5px;min-width:0}
  .orow .dr{font-size:11px;color:var(--dim);white-space:nowrap}
  .navrow{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:14px;flex-wrap:wrap}
  .kbd{font-size:11px;color:var(--dim);margin-top:9px}
  .kbd b{font-weight:400;background:var(--card2);border:1px solid var(--line2);border-radius:3px;padding:1px 5px;margin:0 1px}

  /* ===== coaching / minutes ===== */
  .mins{display:flex;flex-direction:column;gap:14px}
  .min{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh1);overflow:hidden}
  .min>.hd{display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid var(--line);background:var(--head);flex-wrap:wrap}
  .min .dt{font-size:13.5px;font-weight:700}
  .min .co{font-size:11.5px;color:var(--dim)}
  .min>.bd{padding:14px 15px}
  .min h5{font-size:11px;letter-spacing:.08em;color:var(--dim);font-weight:700;margin:0 0 7px}
  .min .sum{font-size:13px;color:var(--ink2);margin:0 0 14px;white-space:pre-wrap}
  .min ul{margin:0 0 14px;padding-left:1.15em;font-size:13px}
  .min ul li{margin-bottom:4px}
  .hwbox{background:var(--card2);border:1px solid var(--line);border-radius:var(--r2);padding:11px 13px}

  /* ===== Jira風ボード ===== */
  .board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:12px;
    overflow-x:auto;padding-bottom:10px;align-items:start}
  .bcol{background:var(--card2);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-width:232px}
  .bhead{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:var(--dim);
    letter-spacing:.06em;padding:2px 4px 10px}
  .bhead .bn{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:1px 7px;font-size:10.5px}
  .blist{display:flex;flex-direction:column;gap:8px;min-height:70px;border-radius:var(--r2);padding:2px}
  .blist.over{background:var(--blue-s);outline:2px dashed var(--blue);outline-offset:-2px}
  .bempty{font-size:11.5px;color:var(--dim);text-align:center;padding:18px 6px;border:1px dashed var(--line2);border-radius:var(--r2)}
  .jcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:10px 11px;
    box-shadow:var(--sh1);cursor:pointer;display:flex;flex-direction:column;gap:8px;text-align:left}
  .jcard:hover{border-color:var(--blue);box-shadow:var(--sh2)}

  page1:1, page2:1, done:null, cotab:"board", sid:"s3", iid:"h1", vu:"中川 雄斗",
};

function save(){
  try{
    const done={}; CATS.forEach(s=>s.courses.forEach(c=>done[c.id]=c.lessons.map(l=>!!l.done)));
    const hw={}; SESSIONS.forEach(s=>s.actions.forEach(h=>hw[h.id]=h.status));
    localStorage.setItem(KEY,JSON.stringify({tier:S.tier,favs:[...S.favs],done,hw}));
  }catch(e){}
}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY)||"null"); if(!d)return;
    if(d.tier)S.tier=d.tier;
    if(Array.isArray(d.favs))S.favs=new Set(d.favs);
    if(d.done)CATS.forEach(s=>s.courses.forEach(c=>{const a=d.done[c.id];
      if(Array.isArray(a))c.lessons.forEach((l,i)=>{if(typeof a[i]==="boolean")l.done=a[i]})}));
    if(d.hw)SESSIONS.forEach(s=>s.actions.forEach(h=>{const v=d.hw[h.id]; if(typeof v==="string"&&AST.some(a=>a[0]===v))h.status=v; else if(typeof v==="boolean")h.status=v?"done":"todo"}));
  }catch(e){}
}

/* ============ ヘルパー ============ */
const allCourses = () => CATS.flatMap(s=>s.courses.map(c=>({st:s,c})));
const findC = id => allCourses().find(x=>x.c.id===id);
const locked = c => c.tier==="elite" && S.tier==="standard";
const dn = c => c.lessons.filter(l=>l.done).length;
const pct = c => Math.round(dn(c)/c.lessons.length*100);
const lstate = (c,i) => c.lessons[i].done?"done":(i===c.lessons.findIndex(l=>!l.done)?"current":"todo");
const secs = d => {const m=/^(\d+):(\d+)$/.exec(d);return m?+m[1]*60+ +m[2]:0};
const cSecs = c => c.lessons.reduce((a,l)=>a+secs(l.dur),0);
const fmtM = s => {const m=Math.max(1,Math.round(s/60));return m>=60?`${Math.floor(m/60)}時間${m%60}分`:`${m}分`};
const NEXT_SESSION = "2026/07/29 20:00";
/* レベル別は「初級｜AI初心者」、実践は名前だけ。工程(FLOW)とは別軸 */
const catLabel = ct => ct.kind==="level" ? `${ct.num}｜${ct.name}`
  : ct.group ? `${ct.group}：${ct.name}` : ct.name;
const levelCats = () => CATS.filter(c=>c.kind==="level");
const practiceCats = () => CATS.filter(c=>c.kind==="practice");
const flowCur = () => FLOW.find(f=>f.status==="current") || FLOW[0];
const catPct = st => {const cs=st.courses.filter(c=>!locked(c));
  const t=cs.reduce((a,c)=>a+c.lessons.length,0),d=cs.reduce((a,c)=>a+dn(c),0);return t?Math.round(d/t*100):0};
const tools = () => [...new Set(allCourses().map(x=>x.c.tool))];
const allHw = () => SESSIONS.flatMap(s=>s.actions.map(h=>({...h,ses:s})));
const overdue = h => !isDone(h) && h.due < TODAY;
function resume(){
  for(const st of CATS) for(const c of st.courses){
    if(locked(c))continue; const i=c.lessons.findIndex(l=>!l.done); if(i>-1)return{st,c,i};
  } return null;
}
function toast(msg){const t=$("#toast");t.textContent=msg;t.dataset.show="true";
  clearTimeout(toast._t);toast._t=setTimeout(()=>t.dataset.show="false",2600)}

/* 修了時の次の一手を決める：同ステージに未修了コースが残ればそれ、
   ステージ自体を修了したなら次のステージ、最終ステージならコーチングへ */
function nextStep(st,c){
  const rest=st.courses.filter(x=>!locked(x)&&pct(x)<100&&x.id!==c.id);
  if(rest.length) return { kind:"course", title:`${c.title} を修了しました。`,
    text:`${st.name} はあと${rest.length}コースです。`, label:`次は「${rest[0].title}」へ`,
    go:()=>{S.done=null;go("course",{cid:rest[0].id})} };
  const i=CATS.findIndex(s=>s.id===st.id), nx=CATS[i+1];
  if(nx) return { kind:"stage", title:`${catLabel(st)} を修了しました。`,
    text:`次は ${catLabel(nx)} です。`, label:`${nx.name}へ進む`,
    go:()=>{S.done=null;go("stage",{cid:nx.id})} };
  return { kind:"all", title:"受講できる全コースを修了しました。",
    text:"あとは案件を取り切るところまで、コーチングで並走します。", label:"コーチングと宿題を見る",
    go:()=>{S.done=null;go("coaching")} };
}

/* 一覧系ページのスクロール位置を覚えて戻ったときに復元する */
const SCROLLKEEP = ["library","fav","stage","tool","search","course","students","logs"];
/* cid が意味を持つページだけキーに含める。含めないと
   go("library") 時に前ページの cid が残ってキーがずれ、復元に失敗する */
const CIDPAGES = ["course","stage","tool"];
const scrollMem = {};
function scrollKeyOf(st){ return st.page + (CIDPAGES.includes(st.page) ? ":"+(st.cid||"") : "") }

function go(page,params){
  if(SCROLLKEEP.includes(S.page)) scrollMem[scrollKeyOf(S)] = window.scrollY;
  Object.assign(S,{page},params||{});
  if($("#side"))$("#side").dataset.open="false";
  $("#scrim").dataset.open="false";
  render();
  const y = SCROLLKEEP.includes(S.page) ? (scrollMem[scrollKeyOf(S)]||0) : 0;
  window.scrollTo({top:y,behavior:"instant"});
}

    h+=`<div class="sidesearch">

function wireCards(){
  $$v("[data-open]").forEach(b=>b.onclick=e=>{

const LIBF=[["all","すべて"],["doing","受講中"],["todo","未着手"],["done","修了"],["fav","♥ お気に入り"]];
function libraryView(title,list,sub){
  const f=S.libFilter;
  const shown=list.filter(({c})=>{
    const p=pct(c);
    if(f==="doing")return !locked(c)&&p>0&&p<100;
    if(f==="todo")return !locked(c)&&p===0;
    if(f==="done")return !locked(c)&&p===100;
    if(f==="fav")return S.favs.has(c.id);
    return true;
  });
  const mins=shown.reduce((a,x)=>a+cSecs(x.c),0);
  let h=crumb([{t:"マイダッシュボード",go:()=>go("dash")},{t:title}]);
  h+=`<h1 class="ptitle">${title}</h1>`;
  if(sub)h+=`<p style="color:var(--dim);font-size:13px;margin:-8px 0 12px">${sub}</p>`;
  h+=`<div class="row" style="gap:6px;margin-bottom:14px">
    ${LIBF.map(([k,v])=>`<button class="b b-sm" data-lf="${k}"
      ${f===k?'style="background:var(--blue);border-color:var(--blue);color:var(--blue-ink);font-weight:600"':""}
      >${v}${k==="fav"&&S.favs.size?` (${S.favs.size})`:""}</button>`).join("")}
    <span class="grow"></span>
    <span style="font-size:12px;color:var(--dim)" class="tnum">${shown.length}コース・計${mins?fmtM(mins):"0分"}</span></div>`;
  h+=shown.length?`<div class="libgrid">${shown.map(x=>courseCard(x.st,x.c)).join("")}</div>`
    :`<div class="card empty">この条件に当てはまるコースはありません。<br>
       <button class="b b-sm" id="lfr" style="margin-top:10px">絞り込みを解除する</button></div>`;
  V().innerHTML=h;

  if($("#lfr"))$("#lfr").onclick=()=>{S.libFilter="all";render()};
  wireCards();
}

/* ============ 受講生: コース詳細 ============ */
function vCourse(){
  const x=findC(S.cid); if(!x){go("library");return}
  const {st,c}=x, p=pct(c), asg=c.lessons.filter(l=>l.dur==="課題").length;

  const nxStage=CATS[CATS.findIndex(s=>s.id===st.id)+1];
  const nx=nxSame||(nxStage?nxStage.courses.find(y=>!locked(y)):null);
  const parts=[{t:"マイダッシュボード",go:()=>go("dash")},{t:"コース一覧",go:()=>go("library")},{t:c.title}];
  let h=crumb(parts)+doneBanner();
  h+=`<div class="row" style="justify-content:space-between;margin-bottom:12px">
    <button class="b b-pri" id="back">↩ ライブラリーに戻る</button>
    <div class="sns"><button class="tw" title="Xで共有">X</button><button class="fb" title="Facebookで共有">f</button><button class="ln" title="LINEで共有">L</button></div></div>`;
  h+=`<div class="card pad" style="margin-bottom:20px"><div class="chead">
    <div class="th">${thumb(c,null)}</div>
    <div><h2>${c.title}</h2>
      <p class="ab">${c.about.join("<br>")}</p>
      <div class="row" style="gap:8px;margin-top:14px">
        <span class="chip b">${catLabel(st)}</span><span class="chip">${c.tool}</span>
        <span class="chip tnum">${c.lessons.length}レッスン</span><span class="chip tnum">計${fmtM(cSecs(c))}</span>
        ${asg?`<span class="chip w">課題${asg}件</span>`:""}</div>
      <div class="row" style="gap:10px;margin-top:14px">
        <div class="bar${p===100?" ok":""}"><i style="width:${p}%"></i></div>
        <span class="tnum" style="font-size:12.5px;color:var(--dim)">${p}%（${dn(c)} / ${c.lessons.length}）</span></div></div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <button class="b b-pri" id="startc">${p===0?"最初から受講する":p===100?"復習する":"続きから受講する"}</button>
      <button class="b" id="goal">${S.favs.has(c.id)?"♥ お気に入り解除":"♡ マイ目標コースに追加"}</button>
      ${nx?`<button class="b" id="nextc">次のコース →</button>`:""}</div>
  </div></div>`;
  h+=`<div class="sectitle">レッスン一覧</div>
    <div class="lesgrid">${c.lessons.map((l,i)=>{const s=lstate(c,i);
      return `<button class="les" data-li="${i}" data-state="${s}">
        <div class="top"><span class="sc">${l.sec}</span><div class="ti">${l.title}</div>
          <span class="st">${s==="done"?"✓ 完了":s==="current"?"▶ 受講中":""}</span>
          <span class="dr tnum">${l.dur}</span></div>
        <div class="bt"><span style="font-size:11px;color:var(--dim)">${l.tasks.length?`課題${l.tasks.length}件`:"　"}</span>
          <span><span class="iconb" role="button">♡</span><span class="iconb sh" role="button">⤴</span></span></div></button>`}).join("")}</div>`;
  V().innerHTML=h;
  wireCrumb(parts); wireDoneBanner();
  $("#back").onclick=()=>go("library");
  $("#startc").onclick=()=>{const i=Math.max(0,c.lessons.findIndex(l=>!l.done));go("lesson",{cid:c.id,li:i===-1?0:i})};
  $("#goal").onclick=()=>{S.favs.has(c.id)?S.favs.delete(c.id):S.favs.add(c.id);save();
    toast(S.favs.has(c.id)?"マイ目標コースに追加しました":"お気に入りから外しました");render()};
  if($("#nextc"))$("#nextc").onclick=()=>go("course",{cid:nx.id});
  $$v(".les").forEach(b=>b.onclick=e=>{if(e.target.closest(".iconb"))return;go("lesson",{cid:c.id,li:+b.dataset.li})});
  $$v(".les .iconb").forEach(b=>b.onclick=e=>{e.stopPropagation();toast("モックのため保存されません")});
}

/* ============ 受講生: レッスン視聴 ============ */
function vLesson(){
  const x=findC(S.cid); if(!x){go("library");return}
  const {st,c}=x, i=Math.min(S.li,c.lessons.length-1), l=c.lessons[i], last=i===c.lessons.length-1;
  const parts=[{t:"マイダッシュボード",go:()=>go("dash")},{t:"コース一覧",go:()=>go("library")},
    {t:c.title,go:()=>go("course",{cid:c.id})},{t:l.sec}];
  let h=crumb(parts);
  h+=`<div class="lgrid"><div>
    <div class="video"><div class="pl">▶</div><div class="tm tnum">${l.dur}</div></div>
    ${l.done?`<div style="font-size:11.5px;color:var(--ok);margin-bottom:6px">✓ 完了済み</div>`:""}
    <h1 style="font-size:19px;margin:0 0 10px">${l.sec}　${l.title}</h1>
    <p style="font-size:14px;color:var(--ink2);max-width:62ch;margin:0 0 18px">${l.body}</p>
    <div class="navrow">
      <button class="b" id="pv" ${i===0?"disabled":""}>← 前へ</button><span class="grow"></span>
      ${l.done?`<button class="b" id="un">完了を取り消す</button>`:""}
      <button class="b b-pri" id="nx">${l.done?(last?"コース詳細に戻る":"次へ →"):(last?"完了してコースを修了":"完了して次へ →")}</button></div>
    <p class="kbd"><b>←</b><b>→</b> でレッスン移動、<b>Esc</b> でコースに戻る</p>
  </div><div>
    <div class="obox"><h4>${c.title}</h4>
      ${c.lessons.map((ll,j)=>`<button class="orow" data-j="${j}" data-state="${lstate(c,j)}" aria-current="${j===i}">
        <span class="dt">${lstate(c,j)==="done"?"✓":lstate(c,j)==="current"?"▶":ll.dur==="課題"?"✎":""}</span>
        <span class="nm">${ll.title}</span><span class="dr tnum">${ll.dur}</span></button>`).join("")}</div>
    <div class="obox"><h4>この回の課題</h4><div style="padding:13px">
      ${l.tasks.length?l.tasks.map((t,k)=>`<label class="hw" data-done="false">
        <input type="checkbox" data-tk="${k}"><span class="tx">${t}</span></label>`).join("")
        :`<span style="font-size:12.5px;color:var(--dim)">この回に課題はありません。</span>`}</div></div>
  </div></div>`;
  V().innerHTML=h;
  wireCrumb(parts);
  $("#pv").onclick=()=>go("lesson",{cid:c.id,li:i-1});
  if($("#un"))$("#un").onclick=()=>{l.done=false;save();render()};
  $("#nx").onclick=()=>{
    const was=l.done; l.done=true; save();
    if(!last){go("lesson",{cid:c.id,li:i+1});return}
    if(!was&&pct(c)===100)S.done=nextStep(st,c);
    go("course",{cid:c.id});
  };
  $$v(".orow").forEach(b=>b.onclick=()=>go("lesson",{cid:c.id,li:+b.dataset.j}));
  $$v("[data-tk]").forEach(cb=>cb.onchange=()=>{cb.closest(".hw").dataset.done=cb.checked});
}

/* ============ 受講生: コーチング＋宿題 ============ */
/* ============ 受講生: コーチング（工程 / 議事録 / ToDo をタブで分ける） ============
   カリキュラム（CATS）は「仕事の能力」を上げる場。
   ここ（FLOW）は「案件・副業を取る」ための工程管理で、コーチが並走する。 */
const COTABS = [["board","ボード"],["flow","工程（エピック）"],["mins","議事録"],["todo","課題一覧"]];

/* Jira風の課題カード。key・優先度・担当・期限・親（工程）を出す */
function issueCard(a){
  const f=FLOW.find(x=>x.id===a.ses.flow);
  const p=PRIO[a.prio]||PRIO.mid;
  return `<div class="jcard" draggable="true" data-issue="${a.id}" tabindex="0" role="button">
    <div class="jtx">${a.text}</div>
    <div class="jmeta">
      ${f?`<span class="epic">工程${f.num} ${f.name}</span>`:""}
      <span class="grow"></span>
      <span class="prio" style="color:${p.c}" title="優先度${p.l}">${p.i}${p.l}</span>
      <span class="jkey tnum">${a.key}</span>
      <span class="jav" title="${a.owner}">${a.owner==="コーチ"?"コ":"自"}</span>
    </div>
    <div class="jdue tnum ${overdue(a)?"over":""}">${overdue(a)?"期限超過 ":""}${a.due}</div>
  </div>`;
}

function jiraBoard(){
  const all=allHw();
  return `<div class="board">${AST.map(([k,lb])=>{
    const list=all.filter(a=>a.status===k).sort((a,b)=>a.due<b.due?-1:1);
    return `<div class="bcol" data-col="${k}">
      <div class="bhead">${lb}<span class="bn tnum">${list.length}</span></div>
      <div class="blist" data-drop="${k}">
        ${list.length?list.map(issueCard).join(""):`<div class="bempty">ここにドラッグ</div>`}</div></div>`}).join("")}</div>`;
}

function wireBoard(){
  let dragId=null;
  $$v("[data-issue]").forEach(el=>{
    el.ondragstart=e=>{dragId=el.dataset.issue;el.classList.add("dragging");e.dataTransfer.effectAllowed="move"};
    el.ondragend=()=>{el.classList.remove("dragging");dragId=null};
    el.onclick=()=>go("issue",{iid:el.dataset.issue});
    el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go("issue",{iid:el.dataset.issue})}};
  });
  $$v("[data-drop]").forEach(z=>{
    z.ondragover=e=>{e.preventDefault();z.classList.add("over")};
    z.ondragleave=()=>z.classList.remove("over");
    z.ondrop=e=>{e.preventDefault();z.classList.remove("over");
      if(!dragId)return;
      setStatus(dragId,z.dataset.drop);
    };
  });
}

function setStatus(id,st){
  let hit=null;
  SESSIONS.forEach(s=>s.actions.forEach(a=>{if(a.id===id){a.status=st;hit=a}}));
  if(hit){save();toast(`${hit.key} を「${stLabel(st)}」に移動しました`);render()}
}

function ownerChip(o){ return o==="コーチ" ? `<span class="chip b">@コーチ</span>` : `<span class="chip">@受講生</span>` }

/* アクションアイテム1行。議事録・ToDo・ダッシュボードで共通に使う */
function actionRow(x,opt){
  const o=opt||{};
  return `<label class="hw" data-done="${isDone(x)}" data-over="${overdue(x)}">
    <input type="checkbox" data-hw="${x.id}" ${isDone(x)?"checked":""}>
    <span class="tx">${x.text}
      <span class="due tnum" style="display:block">${ownerChip(x.owner)}　期限 ${x.due}${overdue(x)?"（超過）":isDone(x)?"（完了）":""}</span>
      ${o.src?`<span class="src">${x.ses.date} ${x.ses.coach}との1on1</span>`:""}</span></label>`;
}

function vCoaching(){
  const parts=[{t:"マイダッシュボード",go:()=>go("dash")},{t:"コーチング"}];
  const all=allHw(), un=all.filter(h=>!isDone(h));
  const cur=flowCur();
  let h=crumb(parts)+`<h1 class="ptitle">コーチング</h1>`;

  /* 上部の固定サマリー：今どの工程にいるか＋未完了のアクションアイテム件数 */
  h+=`<div class="card pad" style="margin-bottom:14px">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div style="min-width:220px">
        <div class="ch" style="margin-bottom:6px">現在の工程</div>
        <div style="font-size:17px;font-weight:700">${cur.num}　${cur.name}</div>
        <div style="font-size:12px;color:var(--dim);margin-top:2px">到達条件：${cur.goal}</div></div>
      <div style="min-width:200px">
        <div class="ch" style="margin-bottom:6px">次回セッション</div>
        <div style="font-size:15px;font-weight:700" class="tnum">${NEXT_SESSION}</div>
        <div style="font-size:11.5px;color:var(--dim)">村田コーチ・1on1 30分</div>
        <button class="link" id="resc" style="margin-top:6px">日程を変更する</button></div>
      <div class="row" style="gap:8px">
        <span class="chip ${un.length?"w":"g"}">未完了 ${un.length}件</span>
        <span class="chip g">完了 ${all.length-un.length}件</span></div></div>
    <div class="hr"></div>
    <p style="font-size:12.5px;color:var(--dim);margin:0">
      仕事の能力はコース（AIスキル）で上げ、案件探し・副業探しはこのコーチングで一緒に進めます。
      セッションの内容は毎回議事録として残り、アクションアイテムがここに追加されます。</p></div>`;

  h+=`<div class="tabs" role="tablist">${COTABS.map(([k,v])=>
    `<button role="tab" data-ct="${k}" aria-selected="${S.cotab===k}">${v}${k==="todo"&&un.length?`（${un.length}）`:""}</button>`).join("")}</div>`;

  if(S.cotab==="board"){
    h+=`<p style="font-size:12px;color:var(--dim);margin:0 0 10px">
      カードをドラッグして状態を動かせます。カードを押すと課題の詳細が開きます。</p>`;
    h+=jiraBoard();
  }

  if(S.cotab==="flow"){
    h+=`<div class="flowwrap">${FLOW.map(f=>{
      const cs=f.cats.map(id=>CATS.find(c=>c.id===id)).filter(Boolean);
      const acts=all.filter(a=>a.ses.flow===f.id);
      const au=acts.filter(a=>!isDone(a)).length;
      return `<div class="fstep" data-st="${f.status}">
        <div class="fnum">${f.status==="done"?"✓":f.num}</div>
        <div class="fbody">
          <div class="row" style="gap:8px;margin-bottom:3px">
            <b style="font-size:15px">${f.name}</b>
            <span class="chip ${f.status==="done"?"g":f.status==="current"?"b":""}">${f.status==="done"?"通過":f.status==="current"?"いまここ":"未着手"}</span>
            ${acts.length?`<span class="chip ${au?"w":"g"}">ToDo ${acts.length-au}/${acts.length}</span>`:""}</div>
          <div style="font-size:12.5px;color:var(--ink2);margin-bottom:6px">${f.desc}</div>
          <div class="goalbox">到達条件：${f.goal}</div>
          <div class="row" style="gap:6px;margin-top:8px">
            <span style="font-size:11px;color:var(--dim)">関連コース</span>
            ${f.courses.map(id=>{const x=findC(id);return x?`<button class="b b-sm" data-oc="${id}">${x.c.title}</button>`:""}).join("")}
            ${cs.map(c=>`<button class="b b-sm" data-ocat="${c.id}">${c.name}</button>`).join("")}</div>
        </div></div>`}).join("")}</div>`;
  }

  if(S.cotab==="mins"){
    h+=`<div class="mins">${SESSIONS.map(s=>{
      const u=s.actions.filter(x=>!isDone(x)).length;
      const f=FLOW.find(x=>x.id===s.flow);
      return `<button class="min minlink" data-ms="${s.id}">
        <div class="hd">
          <span class="dt tnum">${s.date}</span><span class="co">${s.coach}・${s.mins}分</span>
          ${f?`<span class="chip b">工程${f.num} ${f.name}</span>`:""}
          <span class="grow"></span>
          <span class="chip ${u?"w":"g"}">アクション ${s.actions.length-u}/${s.actions.length}</span></div>
        <div class="bd" style="padding:13px 15px">
          <b style="font-size:14.5px">${s.title}</b>
          <p class="sum" style="margin:6px 0 0;-webkit-line-clamp:2;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden">${s.summary}</p>
          <div style="font-size:11.5px;color:var(--blue);margin-top:8px">議事録を開く →</div></div></button>`}).join("")}</div>`;
  }

  if(S.cotab==="todo"){
    const byOwner=[["受講生","自分のアクションアイテム"],["コーチ","コーチのアクションアイテム"]];
    h+=`<div class="grid2" style="align-items:start">${byOwner.map(([o,lb])=>{
      const list=all.filter(a=>a.owner===o).sort((a,b)=>(isDone(a)-isDone(b))||(a.due<b.due?-1:1));
      return `<div class="card pad"><div class="ch">${lb}（未完了${list.filter(x=>!isDone(x)).length}件）</div>
        ${list.length?list.map(x=>actionRow(x,{src:true})).join(""):`<p style="font-size:13px;color:var(--dim);margin:0">ありません。</p>`}</div>`}).join("")}</div>`;
  }

  V().innerHTML=h;
  wireCrumb(parts);
  if($v("#resc"))$v("#resc").onclick=()=>toast("日程変更フォーム（モック）");
  $$v("[data-ct]").forEach(b=>b.onclick=()=>{S.cotab=b.dataset.ct;render()});
  $$v("[data-ms]").forEach(b=>b.onclick=()=>go("minutes",{sid:b.dataset.ms}));
  $$v("[data-oc]").forEach(b=>b.onclick=()=>go("course",{cid:b.dataset.oc}));
  $$v("[data-ocat]").forEach(b=>b.onclick=()=>go("stage",{cid:b.dataset.ocat}));
  wireActions(); wireBoard();
}

/* ============ 課題の詳細（Jira風）============
   左に説明と出典議事録、右にステータス・担当・優先度・期限・親工程 */

          <span class="jkey tnum" style="font-size:12px">${a.key}</span>

      <div class="card pad" style="margin-bottom:14px">

        <p style="font-size:13px;color:var(--ink2);margin:0 0 10px">
          <b class="tnum">${s.date}</b> の${s.coach}との1on1「${s.title}」で設定されました。</p>

/* ============ 運営: ダッシュボード ============ */
function chart(data){
  const W=Math.max(560,data.length*78),H=210,PL=52,PR=14,PT=12,PB=28;
  const max=Math.max(5,Math.ceil(Math.max(...data.map(d=>d.h))));
  const xs=i=>PL+(W-PL-PR)*(data.length===1?0.5:i/(data.length-1));
  const ys=v=>PT+(H-PT-PB)*(1-v/max);
  const pts=data.map((d,i)=>`${xs(i)},${ys(d.h)}`).join(" ");
  let g="";
  for(let v=0;v<=max;v++)g+=`<line x1="${PL}" y1="${ys(v)}" x2="${W-PR}" y2="${ys(v)}" stroke="var(--line)"/>
    <text x="${PL-8}" y="${ys(v)+4}" text-anchor="end" font-size="10" fill="var(--dim)">${v}時間</text>`;
  const lb=data.map((d,i)=>`<text x="${xs(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--dim)">${d.d}</text>`).join("");
  const dots=data.map((d,i)=>`<circle cx="${xs(i)}" cy="${ys(d.h)}" r="3" fill="var(--blue)"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="最近の活動状況">
    ${g}<polyline points="${pts}" fill="none" stroke="var(--blue)" stroke-width="2"/>${dots}${lb}
    <text x="14" y="${H/2}" font-size="10" fill="var(--dim)" transform="rotate(-90 14 ${H/2})" text-anchor="middle">学習時間</text></svg>`;
}

function pager(total,page,per,onGo){
  const pages=Math.max(1,Math.ceil(total/per)),from=total?(page-1)*per+1:0,to=Math.min(total,page*per);
  return {html:`<div class="pager"><span style="font-size:12px;color:var(--dim)" class="tnum">全 ${total} 件中 ${from} - ${to}</span>
    <span class="grow"></span><div class="pg">
    <button data-pg="1" ${page===1?"disabled":""}>|◀</button>
    <button data-pg="${page-1}" ${page===1?"disabled":""}>◀</button>
    <button data-pg="${page+1}" ${page>=pages?"disabled":""}>▶</button>
    <button data-pg="${pages}" ${page>=pages?"disabled":""}>▶|</button></div></div>`,
    wire:()=>$$v("[data-pg]").forEach(b=>b.onclick=()=>onGo(Math.max(1,Math.min(pages,+b.dataset.pg))))};
}

/* ============ 運営: 受講生ひとりの視聴明細（何の動画を見たか）============
   視聴履歴はカリキュラム順に u.lessons 件を完了、次の1件を視聴中として決定的に組み立てる。
   氏名から作る簡易ハッシュで視聴率と日付の散らばりを出す（再描画しても変わらない）。 */
const totalLessons = () => allCourses().reduce((a,x)=>a+x.c.lessons.length,0);
const seedOf = s => [...s].reduce((a,ch)=>(a*31+ch.charCodeAt(0))>>>0, 7);
function shiftDate(ymd,minusDays){
  const [y,m,d]=ymd.split("/").map(Number);
  const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()-minusDays);
  return `${dt.getFullYear()}/${String(dt.getMonth()+1).padStart(2,"0")}/${String(dt.getDate()).padStart(2,"0")}`;
}
function watchLog(u){
  const flat=allCourses().flatMap(({st,c})=>c.lessons.map((l,i)=>({st,c,l,i})));
  const seed=seedOf(u.name);
  const rows=[];
  const n=Math.min(u.lessons,flat.length);
  for(let k=0;k<n;k++){
    const x=flat[k];
    /* 新しいものほど最終ログインに近い日付にする */
    const back=Math.floor((n-1-k)*1.4)+((seed+k)%2);
    rows.push({...x, date:shiftDate(u.last,back), rate:100, state:"done"});
  }
  const nx=flat[n];
  if(nx) rows.push({...nx, date:u.last, rate:20+((seed+n)%6)*11, state:"doing"});
  /* 課題は動画ではないので視聴率を持たせない */
  rows.forEach(r=>{ r.isTask = r.l.dur==="課題"; if(r.isTask) r.rate=null; });
  return rows.reverse();  /* 新しい順 */
}
function vViewDetail(){
  const u=ADMIN.students.find(x=>x.name===S.vu)||ADMIN.students[0];
  const log=watchLog(u);
  const doing=log.filter(r=>r.state==="doing");
  /* コース別に集計 */
  const byCourse={};
  log.forEach(r=>{
    const k=r.c.id;
    byCourse[k]=byCourse[k]||{c:r.c,st:r.st,done:0,secs:0};
    if(r.state==="done"){byCourse[k].done++; byCourse[k].secs+=secs(r.l.dur)}
    else byCourse[k].secs+=Math.round(secs(r.l.dur)*r.rate/100);

  const courses=Object.values(byCourse).sort((a,b)=>b.secs-a.secs);
  const parts=[{t:"運営ダッシュボード",go:()=>go("adash")},

        <select disabled><option>${t.type}</option></select></div>
      <div class="f" style="margin-bottom:11px"><label>テンプレート名 *</label>
        <input id="mn" value="${t.name}"><div class="hint">※推奨：〜32文字</div></div>
      <div class="f" style="margin-bottom:11px"><label>件名 *</label>
        <textarea id="msub" rows="2">${t.subject}</textarea><div class="hint">※推奨：〜300文字</div></div>
      <div class="tagins"><span class="lb">ⓘ タグ挿入</span>
        <button data-tag="[user_name]">＋ 受講生名</button><button data-tag="[coach_name]">＋ 担当コーチ</button>
        <button data-tag="[course_name]">＋ コース名</button><button data-tag="[due_date]">＋ 宿題の期限</button></div>
      <div class="f" style="margin-bottom:11px"><label>本文上部 *</label>
        <textarea id="mtop" rows="8">${t.top}</textarea><div class="hint">※推奨：〜2000文字</div></div>
      <div class="row" style="justify-content:flex-end;margin-bottom:14px">
        <button class="b b-sm" id="mrst">本文上部をデフォルトにリセット</button></div>
      <div class="ro">コース名：[コース名が記載されます]</div>
      <div class="ro">宿題の期限：[期限が記載されます]</div>
      <div class="ro">URL：[URLが記載されます]</div>
      <div class="f"><label>本文下部 *</label><textarea id="mbot" rows="5">${t.bottom}</textarea></div>
    </div></div>`;
  V().innerHTML=h;
  $$v("[data-cb]").forEach(b=>b.onclick=()=>go("adash"));
  $$v("[data-t]").forEach(b=>b.onclick=()=>{S.tmpl=b.dataset.t;render()});
  $$v("[data-tag]").forEach(b=>b.onclick=()=>{
    const ta=$("#mtop"),tag=b.dataset.tag,p=ta.selectionStart||ta.value.length;
    ta.value=ta.value.slice(0,p)+tag+ta.value.slice(p);ta.focus();
    ta.selectionStart=ta.selectionEnd=p+tag.length;toast(`${tag} を挿入しました`)});
  $("#msv").onclick=()=>toast("テンプレートを保存しました（モック）");
  $("#mdel").onclick=()=>toast("削除は確認ダイアログが出ます（モック）");
  $("#reg").onclick=()=>toast("新規テンプレート作成（モック）");
  $("#mrst").onclick=()=>{$("#mtop").value=t.top;toast("本文上部をリセットしました")};
}

/* ============ ルーター ============ */
function render(){
  renderSide();
  const P=S.page;
  if(S.mode==="user"){
    if(P==="dash")vDash();
    else if(P==="course")vCourse();
    else if(P==="lesson")vLesson();
    else if(P==="coaching")vCoaching();
    else if(P==="minutes")vMinutes();
    else if(P==="issue")vIssue();
    else if(P==="fav")libraryView("お気に入りコンテンツ",allCourses().filter(x=>S.favs.has(x.c.id)),"コース詳細の「マイ目標コースに追加」で登録できます。");
    else if(P==="stage"){const st=CATS.find(s=>s.id===S.cid)||CATS[0];
      libraryView(`${catLabel(st)}`,st.courses.map(c=>({st,c})),st.desc)}
    else if(P==="tool")libraryView(`${S.cid} のコース`,allCourses().filter(x=>x.c.tool===S.cid));
    else if(P==="search"){const q=(S.q||"").trim().toLowerCase();
      const list=allCourses().filter(({c})=>{
        if(!q)return true;
        return S.qmode==="course"?(c.title+c.sub+c.tool).toLowerCase().includes(q)
          :c.lessons.some(l=>l.title.toLowerCase().includes(q))});
      libraryView(q?`「${S.q}」の検索結果`:"コース一覧",list,`${S.qmode==="course"?"コース名":"コンテンツ名"}で検索・${list.length}件`)}
    else libraryView("コース一覧",allCourses(),"レベル別・実践コースをすべて表示しています。");
  }else{
    if(P==="students")vStudents();
    else if(P==="logs")vLogs();
    else if(P==="stats")vStats();
    else if(P==="viewing")vViewing();
    else if(P==="viewdetail")vViewDetail();
    else if(P==="taskrate")vTaskRate();
    else if(P==="acoach")vAcoach();
    else if(P==="mail")vMail();
    else vAdash();
  }
}

/* ============ グローバル操作 ============ */
document.addEventListener("keydown",e=>{
  if(S.mode!=="user"||S.page!=="lesson")return;
  const tg=(e.target.tagName||"").toLowerCase();
  if(tg==="input"||tg==="textarea"||tg==="select")return;
  const x=findC(S.cid); if(!x)return;
  const n=x.c.lessons.length;
  if(e.key==="Escape"){e.preventDefault();go("course",{cid:S.cid})}
  if(e.key==="ArrowLeft"&&S.li>0){e.preventDefault();go("lesson",{cid:S.cid,li:S.li-1})}
  if(e.key==="ArrowRight"&&S.li<n-1){e.preventDefault();go("lesson",{cid:S.cid,li:S.li+1})}
});
$("#burger").onclick=()=>{const s=$("#side");const o=s.dataset.open!=="true";
  s.dataset.open=String(o);$("#scrim").dataset.open=String(o)};
$("#scrim").onclick=()=>{$("#side").dataset.open="false";$("#scrim").dataset.open="false"};
$("#ic-mail").onclick=()=>toast("メッセージ一覧（モック）");
$("#ic-bell").onclick=()=>toast("お知らせ：宿題の期限が2件近づいています");

load();
render();
</script>
</body>
</html>
